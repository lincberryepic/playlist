<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>playlist</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #0b0b0b);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 360px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      text-align: center;
    }

    p {
      text-align: center;
      opacity: 0.7;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .song {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin: 8px 0;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
    }

    button {
      background: #1db954;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      color: black;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    .small {
      font-size: 11px;
      opacity: 0.6;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="app">
  <h1>🎧 Offline Music Hub</h1>
  <p>Works without Spotify — add your own audio files</p>

  <div id="list"></div>

  <audio id="player" controls></audio>

  <div class="small">
    Put MP3 files in a folder called <b>music/</b> next to this HTML file
  </div>
</div>

<script>
const songs = [
  {
    name: "Song 1",
    file: "music/song1.mp3"
  },
  {
    name: "Song 2",
    file: "music/song2.mp3"
  },
  {
    name: "Song 3",
    file: "music/song3.mp3"
  }
];

const list = document.getElementById("list");
const player = document.getElementById("player");

function loadSong(song) {
  player.src = song.file;
  player.play();
}

songs.forEach(song => {
  const div = document.createElement("div");
  div.className = "song";

  div.innerHTML = `
    <span>${song.name}</span>
    <button>Play</button>
  `;

  div.querySelector("button").onclick = () => loadSong(song);

  list.appendChild(div);
});
</script>

</body>
</html>
