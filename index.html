<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>playlist</title>
</head>
<body style="font-family: Arial; background:#121212; color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;">

  <h1>Custom Spotify Player</h1>
  <button id="login">Login with Spotify</button>
  <button id="play" style="margin-top:10px;">Play Playlist</button>

  <script>
    const clientId = "YOUR_CLIENT_ID_HERE";
    const redirectUri = window.location.origin;
    const scopes = "user-read-private user-read-email streaming playlist-read-private";

    document.getElementById('login').onclick = () => {
      const authUrl = `https://accounts.spotify.com/authorize` +
        `?client_id=${clientId}` +
        `&response_type=token` +
        `&redirect_uri=${encodeURIComponent(redirectUri)}` +
        `&scope=${encodeURIComponent(scopes)}`;

      window.location = authUrl;
    };

    let accessToken = null;

    // grab token from URL
    window.onload = () => {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      accessToken = params.get('access_token');
    };

    document.getElementById('play').onclick = async () => {
      if (!accessToken) {
        alert("You need to log in first!");
        return;
      }

      const playlistId = "66JijArich6jHznO7MzneL";

      const response = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks`, {
        headers: {
          Authorization: `Bearer ${accessToken}`
        }
      });

      const data = await response.json();
      console.log("Playlist tracks:", data);

      alert("Check console for tracks (real playback needs Spotify Web Playback SDK)");
    };
  </script>

  <p style="margin-top:20px; text-align:center; max-width:500px; opacity:0.7;">
    Note: Full playback requires Spotify Web Playback SDK + Premium account.
    This version demonstrates API access.
  </p>

</body>
</html>
