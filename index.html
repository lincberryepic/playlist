<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>playlist</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1db954, #121212 60%);
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      text-align: center;
      padding: 30px;
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 300px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      opacity: 0.8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    button {
      background: #1db954;
      border: none;
      padding: 15px 20px;
      border-radius: 50px;
      font-size: 16px;
      color: black;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    .small {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎧 Playlist</h1>
    <p>Tap to open your music in Spotify</p>

    <button onclick="openPlaylist()">Open Playlist</button>

    <div class="small">Works best if you're logged into Spotify</div>
  </div>

  <script>
    function openPlaylist() {
      window.open("https://open.spotify.com/playlist/66JijArich6jHznO7MzneL", "_blank");
    }
  </script>

</body
