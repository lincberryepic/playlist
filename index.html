<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>playlist</title>
  <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body style="font-family:Arial;background:#121212;color:white;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">

<div style="text-align:center;max-width:420px;">
  <h1>🎧 Spotify Login App</h1>
  <p>Click below to log in with Spotify</p>

  <button onclick="login()" style="padding:12px 20px;border:none;border-radius:30px;background:#1db954;color:black;font-weight:bold;cursor:pointer;">
    Log in with Spotify
  </button>

  <div id="status" style="margin-top:20px;font-size:14px;opacity:0.8;"></div>
</div>

<script>
const clientId = "YOUR_CLIENT_ID_HERE";
const redirectUri = window.location.origin;
const scopes = [
  "user-read-email",
  "playlist-read-private",
  "streaming"
];

function generateRandomString(length) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let result = '';
  for (let i = 0; i < length; i++) {
    result += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return result;
}

async function sha256(plain) {
  const encoder = new TextEncoder();
  const data = encoder.encode(plain);
  return crypto.subtle.digest('SHA-256', data);
}

function base64urlencode(a) {
  return btoa(String.fromCharCode.apply(null, new Uint8Array(a)))
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/, '');
}

async function createCodeChallenge(verifier) {
  const hashed = await sha256(verifier);
  return base64urlencode(hashed);
}

async function login() {
  const verifier = generateRandomString(128);
  const challenge = await createCodeChallenge(verifier);

  localStorage.setItem('verifier', verifier);

  const authUrl =
    "https://accounts.spotify.com/authorize" +
    "?client_id=" + clientId +
    "&response_type=code" +
    "&redirect_uri=" + encodeURIComponent(redirectUri) +
    "&scope=" + encodeURIComponent(scopes.join(' ')) +
    "&code_challenge_method=S256" +
    "&code_challenge=" + challenge;

  window.location = authUrl;
}

async function getToken(code) {
  const verifier = localStorage.getItem('verifier');

  const body = new URLSearchParams({
    client_id: clientId,
    grant_type: 'authorization_code',
    code: code,
    redirect_uri: redirectUri,
    code_verifier: verifier
  });

  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });

  const data = await res.json();
  return data;
}

async function handleRedirect() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  if (code) {
    document.getElementById('status').innerText = "Logging in...";

    try {
      const tokenData = await getToken(code);

      document.getElementById('status').innerText =
        "Logged in! Access token received (check console).";

      console.log(tokenData);

    } catch (e) {
      document.getElementById('status').innerText = "Login failed.";
      console.error(e);
    }
  }
}

handleRedirect();
</script>

</body>
</html>
