<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Spotify Player</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
    }
    iframe {
      border-radius: 12px;
      margin-top: 20px;
      width: 350px;
      height: 400px;
    }
    h1 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Spotify Playlist 🎧</h1>

    <iframe 
      src="https://open.spotify.com/embed/playlist/66JijArich6jHznO7MzneL"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>

    <p>If you see nothing, make sure your internet is on and try opening this file in Chrome.</p>
  </div>
</body>
</html>
